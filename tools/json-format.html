<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化与可视化工具</title>
    <style>
        :root {
            --paper: #f6f2eb;
            --card: #fdfcfa;
            --ink: #3a342c;
            --ink-soft: #6b6358;
            --line: rgba(58, 52, 44, 0.12);
            --accent: #5c5347;
            --mono: "JetBrains Mono", Consolas, "Sarasa Mono SC", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            padding: 24px 18px 40px;
            line-height: 1.65;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
        }

        header {
            text-align: left;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--ink-soft);
            font-weight: 400;
        }

        .content {
            display: flex;
            gap: 0;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 2px 24px rgba(58, 52, 44, 0.06);
            overflow: hidden;
            min-height: 560px;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .input-section {
                border-right: none;
                border-bottom: 1px solid var(--line);
            }
        }

        .input-section,
        .output-section {
            flex: 1;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
        }

        .input-section {
            border-right: 1px solid var(--line);
        }

        .section-title {
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: var(--ink);
            font-weight: 600;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 13px;
            resize: none;
            transition: border-color 0.2s, background 0.2s;
            font-family: var(--mono);
            line-height: 1.55;
            background: #faf8f5;
            color: var(--ink);
        }

        textarea:focus {
            border-color: rgba(92, 83, 71, 0.45);
            outline: none;
            background: var(--card);
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            background: #6b6358;
            color: #faf8f5;
            border: 1px solid rgba(58, 52, 44, 0.15);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            font-weight: 600;
            font-size: 12px;
            font-family: inherit;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background: #5c5347;
        }

        button.format {

        }

        button.format:hover {
            background: #3f5a46;

        button.clear {
            background: #8b5a52;
        }

        }

        button.expand-all {

        button.expand-all:hover {

        }

        button.collapse-all {
            background: #8a7a4a;

        button.collapse-all:hover {
            background: #6f623c;
        }

            flex: 1;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 0;
            overflow: auto;
            background: #fafafa;
            font-family: var(--mono);
            font-size: 12px;

        .json-tree {
            --json-indent: 16px;
        }

        .json-row {
            display: flex;
            align-items: flex-start;
            min-height: 1.4em;
            padding: 0 12px 0 8px;
            white-space: pre-wrap;
            word-break: break-all;

        .json-row:hover {
            background: rgba(58, 52, 44, 0.04);

        .json-ln {
            flex: 0 0 36px;
            text-align: right;
            padding-right: 8px;
            color: #b0b0b0;
            user-select: none;
            font-size: 11px;
            line-height: 1.4;
        }

        .json-fold-slot {
            flex: 0 0 14px;
            line-height: 1.4;

        .json-fold-toggle {
            cursor: pointer;
            color: #888;
            font-size: 10px;
            user-select: none;
            display: inline-block;
            width: 14px;
            text-align: center;
        }

        .json-fold-toggle:hover {
            color: var(--accent);
        }

        .json-fold-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .json-row-body {
            flex: 1;
            min-width: 0;
            line-height: 1.4;
        }

        .json-fold-children.collapsed {
            display: none;
        }

        .json-key {
            color: #333;
            font-weight: 400;
        }

        .json-string {
            color: #4d6b55;
        }

        .json-number {
            color: #c7254e;
        }

        .json-boolean {

        }

        .json-null {

        .json-punctuation {

        }

            color: #7a3d38;
            font-weight: 600;
            padding: 10px 12px;
            background: #f5e9e7;
            border-radius: 6px;
            margin-top: 10px;

        .stat-item {

            border-bottom: 1px dashed #ccc;

        .icon {

<body>
    <div class="container">
        <p class="nav-back"><a href="{{ site.baseurl }}/tools/">← 返回工具</a></p>
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

        <header>
            <h1>JSON格式化与可视化工具</h1>
            <p class="subtitle">输入JSON字符串，实时格式化并支持折叠查看</p>
        </header>

        <div class="content">
            <div class="input-section">
                <h2 class="section-title"><span class="icon">📥</span> JSON输入</h2>
                <div class="input-area">
                    <textarea id="jsonInput"
                        placeholder='在此处输入JSON字符串，例如：{"name": "John", "age": 30, "hobbies": ["reading", "gaming"], "address": {"city": "Beijing", "country": "China"}}'>{
  "users": [
    {
      "id": 1,

      "email": "zhangsan@example.com",
      "active": true,
      "profile": {
        "bio": "全栈开发工程师",
        "skills": ["JavaScript", "Python", "Go"],
        "experience": 5
      }
    },
    {
      "id": 2,
      "name": "李四",
      "age": 32,
      "email": "lisi@example.com",
      "active": false,
      "profile": {
        "bio": "数据科学家",
        "skills": ["Python", "R", "SQL"],
        "experience": 7
      }
    }
  ],
  "total": 2,
  "success": true
}</textarea>
                    <div class="controls">
                        <button class="format" onclick="formatJSON()"><span class="icon">✨</span> 格式化JSON</button>
                        <button class="expand-all" onclick="expandAll()"><span class="icon">📂</span> 全部展开</button>
                        <button class="collapse-all" onclick="collapseAll()"><span class="icon">📁</span> 全部折叠</button>
                        <button class="clear" onclick="clearInput()"><span class="icon">🗑️</span> 清空输入</button>
                    </div>
                </div>
            </div>

            <div class="output-section">
                <h2 class="section-title"><span class="icon">📤</span> 格式化输出</h2>
                <div class="controls">
                    <button class="copy-btn" onclick="copyOutput()"><span class="icon">📋</span> 复制JSON</button>
                </div>
                <div class="output-area" id="jsonOutput" tabindex="0">
                    <!-- 格式化后的JSON将在这里显示 -->
                </div>
                <div class="stats" id="jsonStats">
                    <!-- JSON统计信息将在这里显示 -->
                </div>
            </div>
        </div>

        <footer>
            <p>JSON格式化工具 &copy; 2023 | 支持折叠展开、语法高亮、实时验证、主题切换</p>
        </footer>
    </div>

    <script>
        // 页面加载时自动格式化示例JSON
        document.addEventListener('DOMContentLoaded', function () {
            formatJSON();
        });

        // 当前JSON对象，用于操作
        let currentJsonObj = null;

        // 格式化JSON函数
        function formatJSON() {
            const input = document.getElementById('jsonInput').value;
            const output = document.getElementById('jsonOutput');
            const stats = document.getElementById('jsonStats');

            // 清空输出区域
            output.innerHTML = '';
            stats.innerHTML = '';

            if (!input.trim()) {
                output.innerHTML = '<div class="error">请输入JSON字符串</div>';
                return;
            }

            try {
                // 解析JSON
                currentJsonObj = JSON.parse(input);

                const lineCounter = { n: 1 };
                const formattedJSON = createFormattedJSON(currentJsonObj, 0, lineCounter);
                output.appendChild(formattedJSON);

                // 显示统计信息
                displayStats(currentJsonObj);

                // 显示成功消息
                const successMsg = document.createElement('div');
                successMsg.className = 'success';
                successMsg.textContent = 'JSON格式正确！';
                stats.insertBefore(successMsg, stats.firstChild);

            } catch (error) {
                output.innerHTML = `<div class="error">JSON格式错误: ${error.message}</div>`;
            }
        }

        function createFormattedJSON(obj, depth, lineCounter, keyLabel) {
            const tree = document.createElement('div');
            tree.className = 'json-tree';

            function indentPx(d) {
                return d * 16;
            }

            function nextLineNum() {
                return lineCounter.n++;
            }

            function appendRow(parent, d, bodyHtml, toggleEl) {
                const row = document.createElement('div');
                row.className = 'json-row';

                const ln = document.createElement('span');
                ln.className = 'json-ln';
                ln.textContent = nextLineNum();

                const slot = document.createElement('span');
                slot.className = 'json-fold-slot';
                if (toggleEl) slot.appendChild(toggleEl);

                const body = document.createElement('span');
                body.className = 'json-row-body';
                body.style.paddingLeft = indentPx(d) + 'px';
                body.innerHTML = bodyHtml;

                row.appendChild(ln);
                row.appendChild(slot);
                row.appendChild(body);
                parent.appendChild(row);
                return row;
            }

            function appendPrimitive(parent, d, keyLabel, value) {
                let valHtml = '';
                if (typeof value === 'string') {
                    valHtml = `<span class="json-string">"${escapeHtml(value)}"</span>`;
                } else if (typeof value === 'number') {
                    valHtml = `<span class="json-number">${value}</span>`;
                } else if (typeof value === 'boolean') {
                    valHtml = `<span class="json-boolean">${value}</span>`;
                } else if (value === null) {
                    valHtml = '<span class="json-null">null</span>';
                }
                const prefix = keyLabel
                    ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span>`
                    : '';
                appendRow(parent, d, prefix + valHtml, null);
            }

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function renderValue(parent, value, d, keyLabel, addComma) {
                const comma = addComma ? '<span class="json-punctuation">,</span>' : '';

                if (Array.isArray(value)) {
                    if (value.length === 0) {
                        const inner = keyLabel
                            ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span><span class="json-punctuation">[</span><span class="empty-array">空数组</span><span class="json-punctuation">]</span>${comma}`
                            : `<span class="json-punctuation">[</span><span class="empty-array">空数组</span><span class="json-punctuation">]</span>${comma}`;
                        appendRow(parent, d, inner, null);
                        return;
                    }

                    const block = document.createElement('div');
                    block.className = 'json-block';

                    const children = document.createElement('div');
                    children.className = 'json-fold-children';

                    const toggle = document.createElement('span');
                    toggle.className = 'json-fold-toggle';
                    toggle.textContent = '▼';
                    const openRow = appendRow(block, d, '', toggle);
                    const openBody = openRow.querySelector('.json-row-body');
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'json-collapsed-hint json-punctuation';
                    ellipsis.textContent = ' … ]';
                    ellipsis.hidden = true;

                    const openInner = keyLabel
                        ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span><span class="json-punctuation">[</span>`
                        : '<span class="json-punctuation">[</span>';
                    openBody.insertAdjacentHTML('afterbegin', openInner);
                    openBody.appendChild(ellipsis);

                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const collapsed = children.classList.toggle('collapsed');
                        toggle.classList.toggle('collapsed', collapsed);
                        ellipsis.hidden = !collapsed;
                    });

                    block.appendChild(children);

                    value.forEach((item, i) => {
                        renderNode(children, item, d + 1, null, i < value.length - 1);
                    });

                    appendRow(children, d, '<span class="json-punctuation">]</span>' + comma, null);
                    parent.appendChild(block);

                } else if (value !== null && typeof value === 'object') {
                    const keys = Object.keys(value);
                    if (keys.length === 0) {
                        const inner = keyLabel
                            ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span><span class="json-punctuation">{</span><span class="empty-object">空对象</span><span class="json-punctuation">}</span>${comma}`
                            : `<span class="json-punctuation">{</span><span class="empty-object">空对象</span><span class="json-punctuation">}</span>${comma}`;
                        appendRow(parent, d, inner, null);
                        return;
                    }

                    const block = document.createElement('div');
                    block.className = 'json-block';

                    const children = document.createElement('div');
                    children.className = 'json-fold-children';

                    const toggle = document.createElement('span');
                    toggle.className = 'json-fold-toggle';
                    toggle.textContent = '▼';
                    const openRow = appendRow(block, d, '', toggle);
                    const openBody = openRow.querySelector('.json-row-body');
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'json-collapsed-hint json-punctuation';
                    ellipsis.textContent = ' … }';
                    ellipsis.hidden = true;

                    const openInner = keyLabel
                        ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span><span class="json-punctuation">{</span>`
                        : '<span class="json-punctuation">{</span>';
                    openBody.insertAdjacentHTML('afterbegin', openInner);
                    openBody.appendChild(ellipsis);

                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const collapsed = children.classList.toggle('collapsed');
                        toggle.classList.toggle('collapsed', collapsed);
                        ellipsis.hidden = !collapsed;
                    });

                    block.appendChild(children);

                    keys.forEach((k, i) => {
                        renderNode(children, value[k], d + 1, k, i < keys.length - 1);
                    });

                    appendRow(children, d, '<span class="json-punctuation">}</span>' + comma, null);
                    parent.appendChild(block);

                } else {
                    appendPrimitive(parent, d, keyLabel, value);
                    if (addComma) {
                        const rows = parent.querySelectorAll(':scope > .json-row');
                        const last = rows[rows.length - 1];
                        if (last) {
                            last.querySelector('.json-row-body').insertAdjacentHTML('beforeend', '<span class="json-punctuation">,</span>');
                        }
                    }
                }
            }

            function renderNode(parent, value, d, keyLabel, addComma) {
                if (Array.isArray(value) || (value !== null && typeof value === 'object')) {
                    renderValue(parent, value, d, keyLabel, addComma);
                } else {
                    let valHtml = '';
                    if (typeof value === 'string') {
                        valHtml = `<span class="json-string">"${escapeHtml(value)}"</span>`;
                    } else if (typeof value === 'number') {
                        valHtml = `<span class="json-number">${value}</span>`;
                    } else if (typeof value === 'boolean') {
                        valHtml = `<span class="json-boolean">${value}</span>`;
                    } else if (value === null) {
                        valHtml = '<span class="json-null">null</span>';
                    }
                    const prefix = keyLabel
                        ? `<span class="json-key">"${escapeHtml(keyLabel)}"</span><span class="json-punctuation">: </span>`
                        : '';
                    appendRow(parent, d, prefix + valHtml + (addComma ? '<span class="json-punctuation">,</span>' : ''), null);
                }
            }

            const rootWrap = document.createElement('div');
            if (Array.isArray(obj) || (obj !== null && typeof obj === 'object')) {
                renderValue(rootWrap, obj, depth, keyLabel, false);
            } else {
                renderNode(rootWrap, obj, depth, keyLabel, false);
            }
            tree.appendChild(rootWrap);
            return tree;
        }

        // 显示JSON统计信息
        function displayStats(obj) {
            const stats = document.getElementById('jsonStats');
            let objectCount = 0;
            let arrayCount = 0;
            let stringCount = 0;
            let numberCount = 0;
            let booleanCount = 0;
            let nullCount = 0;
            let totalKeys = 0;

            function traverse(obj) {
                if (Array.isArray(obj)) {
                    arrayCount++;
                    obj.forEach(item => traverse(item));
                } else if (obj !== null && typeof obj === 'object') {
                    objectCount++;
                    const keys = Object.keys(obj);
                    totalKeys += keys.length;
                    Object.values(obj).forEach(value => traverse(value));
                } else if (typeof obj === 'string') {
                    stringCount++;
                } else if (typeof obj === 'number') {
                    numberCount++;
                } else if (typeof obj === 'boolean') {
                    booleanCount++;
                } else if (obj === null) {
                    nullCount++;
                }
            }

            traverse(obj);

            const totalItems = objectCount + arrayCount + stringCount + numberCount + booleanCount + nullCount;

            stats.innerHTML = `
                <div class="stat-item"><span>总元素数:</span> <span class="stat-value">${totalItems}</span></div>
                <div class="stat-item"><span>对象:</span> <span class="stat-value">${objectCount}</span></div>
                <div class="stat-item"><span>数组:</span> <span class="stat-value">${arrayCount}</span></div>
                <div class="stat-item"><span>字符串:</span> <span class="stat-value">${stringCount}</span></div>
                <div class="stat-item"><span>数字:</span> <span class="stat-value">${numberCount}</span></div>
                <div class="stat-item"><span>布尔值:</span> <span class="stat-value">${booleanCount}</span></div>
                <div class="stat-item"><span>Null:</span> <span class="stat-value">${nullCount}</span></div>
                <div class="stat-item"><span>总键数:</span> <span class="stat-value">${totalKeys}</span></div>
            `;
        }

        // 清空输入
        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').innerHTML = '';
            document.getElementById('jsonStats').innerHTML = '';
            currentJsonObj = null;
        }

        // 全部展开
        function expandAll() {
            document.querySelectorAll('.json-fold-children').forEach(el => {
                el.classList.remove('collapsed');
            });
            document.querySelectorAll('.json-fold-toggle').forEach(el => {
                el.classList.remove('collapsed');
            });
            document.querySelectorAll('.json-collapsed-hint').forEach(el => {
                el.hidden = true;
            });
        }

        // 全部折叠
        function collapseAll() {
            document.querySelectorAll('.json-fold-children').forEach(el => {
                el.classList.add('collapsed');
            });
            document.querySelectorAll('.json-fold-toggle').forEach(el => {
                el.classList.add('collapsed');
            });
            document.querySelectorAll('.json-collapsed-hint').forEach(el => {
                el.hidden = false;
            });
        }

        // 复制输出
        function copyOutput() {
            if (!currentJsonObj) {
                alert('没有可复制的JSON内容');
                return;
            }

            const jsonString = JSON.stringify(currentJsonObj, null, 2);
            navigator.clipboard.writeText(jsonString).then(() => {
                // 显示复制成功提示
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="icon">✅</span> 已复制';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }).catch(err => {
                console.error('复制失败: ', err);
                alert('复制失败，请手动复制');
            });
        }

        // 切换主题
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const themeBtn = document.querySelector('.theme-toggle');
            if (document.body.classList.contains('dark-theme')) {
                themeBtn.textContent = '☀️';
            } else {
                themeBtn.textContent = '🌙';
            }
        }

        // 添加实时格式化功能（带防抖）
        document.getElementById('jsonInput').addEventListener('input', function () {
            clearTimeout(this.timer);
            this.timer = setTimeout(formatJSON, 500);
        });

        // 添加键盘快捷键
        document.addEventListener('keydown', function (e) {
            // Ctrl+Enter 格式化
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                formatJSON();
            }

            // Ctrl+E 全部展开
            if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                expandAll();
            }

            // Ctrl+C 全部折叠
            if (e.ctrlKey && e.key === 'c') {
                e.preventDefault();
                collapseAll();
            }
        });
    </script>
</body>

</html>

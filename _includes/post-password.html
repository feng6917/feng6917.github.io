<div id="post-password-gate" class="post-password-gate" role="dialog" aria-modal="true" aria-labelledby="post-password-title">
  <div class="post-password-gate__card">
    <h2 id="post-password-title" class="post-password-gate__title">访问验证</h2>
    <p class="post-password-gate__desc">本文档为知识复习资料，请输入访问密码后继续阅读。</p>
    <form id="post-password-form" class="post-password-gate__form" autocomplete="off">
      <input
        id="post-password-input"
        class="post-password-gate__input"
        type="password"
        name="password"
        placeholder="请输入访问密码"
        required
        autofocus
      />
      <p id="post-password-error" class="post-password-gate__error" hidden></p>
      <button type="submit" class="post-password-gate__btn">确认</button>
    </form>
    <p class="post-password-gate__hint">最多可尝试 3 次，失败将返回上一页。</p>
  </div>
</div>

<style>
  .post-password-gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(4px);
  }

  .post-password-gate__card {
    width: min(420px, 100%);
    padding: 28px 24px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 18px 48px rgba(15, 23, 42, 0.22);
  }

  .post-password-gate__title {
    margin: 0 0 8px;
    font-size: 1.35rem;
    color: #1e293b;
  }

  .post-password-gate__desc,
  .post-password-gate__hint {
    margin: 0;
    line-height: 1.6;
    color: #64748b;
    font-size: 0.95rem;
  }

  .post-password-gate__form {
    margin: 20px 0 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .post-password-gate__input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .post-password-gate__input:focus {
    border-color: #1bb75c;
    box-shadow: 0 0 0 3px rgba(27, 183, 92, 0.18);
  }

  .post-password-gate__btn {
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #1bb75c, #159947);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .post-password-gate__btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(27, 183, 92, 0.28);
  }

  .post-password-gate__error {
    margin: 0;
    color: #dc2626;
    font-size: 0.92rem;
  }

  .entry--protected,
  .comment--protected,
  .pagination--protected {
    display: none;
  }

  .entry--protected.is-unlocked,
  .comment--protected.is-unlocked {
    display: block !important;
  }

  .pagination--protected.is-unlocked {
    display: inline-block !important;
  }
</style>

<script>
  (function () {
    var expected = {{ page.access_password | default: "myz" | jsonify }};
    var gate = document.getElementById("post-password-gate");
    var form = document.getElementById("post-password-form");
    var input = document.getElementById("post-password-input");
    var error = document.getElementById("post-password-error");
    var attempts = 0;
    var maxAttempts = 3;

    function getProtectedNodes() {
      return document.querySelectorAll(".entry--protected, .comment--protected, .pagination--protected");
    }

    function unlock() {
      if (gate) gate.remove();
      getProtectedNodes().forEach(function (node) {
        node.removeAttribute("hidden");
        node.classList.add("is-unlocked");
      });
    }

    function deny(message) {
      attempts += 1;
      if (error) {
        error.hidden = false;
        error.textContent = message;
      }
      if (input) {
        input.value = "";
        input.focus();
      }
      if (attempts >= maxAttempts) {
        alert("三次机会已用完，即将返回上一页。");
        history.go(-1);
      }
    }

    function init() {
      if (!form || !input) return;

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        if (input.value === expected) {
          unlock();
          return;
        }
        var left = maxAttempts - attempts;
        deny(left > 1 ? "密码错误，还剩 " + left + " 次机会。" : "密码错误，还剩 1 次机会。");
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
